server {
  listen 80;
  server_name _;

  # Frontend (Next server en 3000)
  location / {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Backend FastAPI con prefijo /api
  location /api/ {
    rewrite ^/api/?(.*)$ /$1 break;
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Archivos subidos (fotos)
  location /uploads/ {
    proxy_pass http://backend:8000/uploads/;
  }

  # (Opcional) gzip y cache básico
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
  gzip_min_length 1024;

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }
}
